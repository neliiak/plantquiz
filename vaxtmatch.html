<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Växtmatchning</title>
<style>
:root{--forest:#244b39;--leaf:#477a58;--cream:#f5f4eb;--ink:#20382d;--muted:#68796f;--line:#dce4d9;--paper:#fff;--gold:#dbb759}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1240px;margin:auto;padding:30px 24px 56px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.13em;color:var(--leaf);font-weight:800}h1{font:clamp(2.2rem,5vw,3.8rem)/1 Georgia,serif;margin:8px 0 10px;color:var(--forest)}.intro{max-width:640px;color:var(--muted);margin:0 0 22px}.score{background:#e7ecdf;border-radius:999px;padding:9px 15px;font-weight:750;white-space:nowrap}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar label{font-weight:700}select,.btn{font:inherit;border-radius:11px;padding:10px 14px}select{border:1px solid var(--line);background:white;color:var(--ink)}.btn{border:0;background:var(--forest);color:white;font-weight:750;cursor:pointer;transition:transform .13s,background .13s}.btn:hover:not(:disabled){background:var(--leaf);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:default}.btn.light{background:#e7ecdf;color:var(--ink)}.progress{height:7px;background:#e3e8df;border-radius:9px;overflow:hidden;margin:12px 0 18px}.progress span{height:100%;display:block;background:var(--leaf);transition:width .25s}.panel{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:clamp(16px,2.7vw,28px);box-shadow:0 12px 35px #20382d0d}.roundhead{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.9rem;font-weight:700;margin-bottom:14px}.match-layout{display:grid;grid-template-columns:minmax(205px,260px) minmax(0,1fr);gap:22px;align-items:start}.names-title,.images-title{font:1.22rem Georgia,serif;margin:0 0 12px}.name-list{display:grid;gap:9px}.name-choice{width:100%;min-height:58px;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:13px;color:var(--ink);font:inherit;cursor:pointer}.name-choice:hover{border-color:var(--leaf)}.name-choice.selected{outline:2px solid var(--forest);background:#f4f8f1}.name-choice.matched{border-color:var(--match);background:color-mix(in srgb,var(--match) 10%,white)}.name-choice.correct{border-color:#4d9a5a;background:#e8f5e8}.name-choice.incorrect{border-color:#c46955;background:#fff0ed}.dot{width:13px;height:13px;border-radius:50%;background:var(--dot,#dce4d9);flex:0 0 13px}.name-choice:not(.matched) .dot{background:#e4e9e2}.images{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.plant-card{min-width:0;border:2px solid var(--line);border-radius:15px;padding:7px;background:white;cursor:pointer;transition:border-color .15s,transform .15s}.plant-card:hover{transform:translateY(-2px);border-color:var(--leaf)}.plant-card.matched{border-color:var(--match)}.plant-card.correct{border-color:#4d9a5a;background:#f2faf1}.plant-card.incorrect{border-color:#c46955;background:#fff3f0}.plant-card img{display:block;width:100%;aspect-ratio: .78;object-fit:cover;border-radius:9px;background:#eef1eb}.plant-card .img-caption{font-size:.82rem;color:var(--muted);margin:7px 2px 2px;min-height:2.4em}.plant-card .revealed{display:block;color:var(--forest);font-size:.78rem;font-weight:750;margin:2px}.help{font-size:.88rem;color:var(--muted);margin:14px 0 0}.feedback{min-height:28px;margin:12px 0;font-weight:750}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:16px}.result{display:none;text-align:center;padding:36px}.result h2{font:2.4rem Georgia,serif;color:var(--forest)}.result p{color:var(--muted)}@media(max-width:900px){.match-layout{grid-template-columns:200px minmax(0,1fr);gap:14px}.images{gap:6px}.plant-card{padding:5px}.plant-card .img-caption{font-size:.72rem}}@media(max-width:650px){.wrap{padding:18px 12px 40px}.top{align-items:flex-start;flex-direction:column}.match-layout{grid-template-columns:1fr}.name-list{grid-template-columns:repeat(2,minmax(0,1fr))}.images{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.plant-card img{aspect-ratio:1.05}.actions{align-items:stretch;flex-direction:column-reverse}.actions .btn{width:100%}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Bildquiz · para ihop</div><h1>Växtmatchning</h1><p class="intro">Välj ett latinskt namn till vänster och klicka sedan på bilden som hör ihop med namnet. Para ihop alla fem och rätta raden.</p></div><div class="score" id="score">Rätt 0</div></header><div class="toolbar"><label for="group">Växtgrupp</label><select id="group"><option>Buskar</option><option>Träd</option><option>Barr & städsegrönt</option></select><button class="btn light" id="restart">Blanda om</button></div><div class="progress"><span id="bar"></span></div><section class="panel" id="game"><div class="roundhead"><span id="round"></span><span id="category"></span></div><div class="match-layout"><section><h2 class="names-title">Latinska namn</h2><div class="name-list" id="names"></div><p class="help" id="help">Klicka först på ett namn, sedan på en bild.</p></section><section><h2 class="images-title">Bilder</h2><div class="images" id="images"></div></section></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><span class="help" id="status">0 av 5 ihopparade</span><button class="btn" id="check" disabled>Rätta raden</button><button class="btn" id="next" style="display:none">Nästa rad →</button></div></section><section class="panel result" id="result"></section></main><script>
const items=[{"id":"b1","sv":"Häggmispel","latin":"Amelanchier","cultivar":"","cat":"Lignoser/Buskar - Tåliga medelhöga/höga","file":"b1.png","group":"Buskar"},{"id":"b2","sv":"korallkornell","latin":"Cornus alba","cultivar":"Sibirica","cat":"Lignoser/Buskar - Tåliga medelhöga/höga","file":"b2.png","group":"Buskar"},{"id":"b3","sv":"bukettapel","latin":"Malus toringo var. sargentii","cultivar":"","cat":"Lignoser/Buskar - Tåliga medelhöga/höga","file":"b3.png","group":"Buskar"},{"id":"b4","sv":"fläder","latin":"Sambucus nigra","cultivar":"","cat":"Lignoser/Buskar - Tåliga medelhöga/höga","file":"b4.png","group":"Buskar"},{"id":"b5","sv":"Ölandstok","latin":"Dasiphora Fruticosa","cultivar":"Goldfinger E","cat":"Lignoser/Buskar - Tåliga lägre","file":"b5.png","group":"Buskar"},{"id":"b6","sv":"Norskspirea/Brudspirea","latin":"Spiraea × cinerea","cultivar":"Grefsheim E","cat":"Lignoser/Buskar - Tåliga lägre","file":"b6.png","group":"Buskar"},{"id":"b7","sv":"bukettspirea","latin":"Spiraea × vanhouttei","cultivar":"","cat":"Lignoser/Buskar - Tåliga lägre","file":"b7.png","group":"Buskar"},{"id":"b8","sv":"rosenspirea","latin":"Spiraea japonica","cultivar":"Anthony Waterer, Genpei","cat":"Lignoser/Buskar - Tåliga lägre","file":"b8.png","group":"Buskar"},{"id":"b9","sv":"japansk lönn","latin":"Acer palmatum","cultivar":"'Osakazuki', 'atropurpureum'","cat":"Lignoser/Buskar - Surjord","file":"b9.png","group":"Buskar"},{"id":"b10","sv":"vidjehortensia","latin":"Hydrangea arborescens","cultivar":"'Annabelle'","cat":"Lignoser/Buskar - Surjord","file":"b10.png","group":"Buskar"},{"id":"b11","sv":"trädgårdshortensia","latin":"Hydrangea macrophylla","cultivar":"","cat":"Lignoser/Buskar - Surjord","file":"b11.png","group":"Buskar"},{"id":"b12","sv":"vipphortensia","latin":"Hydrangea paniculata","cultivar":"Limelight'PBR","cat":"Lignoser/Buskar - Surjord","file":"b12.png","group":"Buskar"},{"id":"b13","sv":"stjärnmagnolia","latin":"Magnolia stellata","cultivar":"","cat":"Lignoser/Bu :"t15","sv":"Purpurapel","latin":"Malus 'Royalty'","cultivar":"","cat":"Lignoser - Träd","file":"t15.png","group":"Träd"},{"id":"t16","sv":"Rönn","latin":"Sorbus aucuparia","cultivar":"","cat":"Lignoser - Träd","file":"t16.png","group":"Träd"},{"id":"t17","sv":"Silverpoppel","latin":"Populus alba","cultivar":"","cat":"Lignoser - Träd","file":"t17.png","group":"Träd"},{"id":"t18","sv":"Skogsalm","latin":"Ulmus glabra","cultivar":"","cat":"Lignoser - Träd","file":"t18.png","group":"Träd"},{"id":"t19","sv":"Skogsek","latin":"Quercus robur","cultivar":"","cat":"Lignoser - Träd","file":"t19.png","group":"Träd"},{"id":"t20","sv":"Skogslind","latin":"Tilia cordata","cultivar":"","cat":"Lignoser - Träd","file":"t20.png","group":"Träd"},{"id":"t21","sv":"Skogslönn","latin":"Acer platanoides","cultivar":"","cat":"Lignoser - Träd","file":"t21.png","group":"Träd"},{"id":"t22","sv":"Tulpanträd","latin":"Liriodendron tulipifera","cultivar":"","cat":"Lignoser - Träd","file":"t22.png","group":"Träd"},{"id":"t23","sv":"Valnöt","latin":"Juglans regia","cultivar":"","cat":"Lignoser - Träd","file":"t23.png","group":"Träd"},{"id":"t24","sv":"Vitpil","latin":"Salix alba","cultivar":"","cat":"Lignoser - Träd","file":"t24.png","group":"Träd"},{"id":"t25","sv":"Vårtbjörk","latin":"Betula pendula","cultivar":"","cat":"Lignoser - Träd","file":"t25.png","group":"Träd"},{"id":"s1","sv":"koreagran FK ULTUNA E","latin":"Abies koreana","cultivar":"FK ULTUNA E","cat":"Barr och städsegrönt","file":"s1.png","group":"Barr & städsegrönt"},{"id":"s2","sv":"ginkgo","latin":"Ginkgo biloba","cultivar":"","cat":"Barr och städsegrönt","file":"s2.png","group":"Barr & städsegrönt"},{"id":"s3","sv":"tuja","latin":"Thuja occidentalis","cultivar":"","cat":"Barr och städsegrönt","file":"s3.png","group":"Barr & städsegrönt"},{"id":"s4","sv":"buxbom","latin":"Buxus sempervirens","cultivar":"","cat":"Barr och städsegrönt","file":"s4.png","group":"Barr & städsegrönt"},{"id":"s5","sv":"ädelcypress","latin":"Chamaecyparis lawsoniana","cultivar":"'Columnaris'","cat":"Barr och städsegrönt","file":"s5.png","group":"Barr & städsegrönt"},{"id":"s6","sv":"järnek","latin":"Ilex aquifolium","cultivar":"'Alaska'","cat":"Barr och städsegrönt","file":"s6.png","group":"Barr & städsegrönt"},{"id":"s7","sv":"himalaya-en","latin":"Juniperus squamata","cultivar":"'Blue Carpet'","cat":"Barr och städsegrönt","file":"s7.png","group":"Barr & städsegrönt"},{"id":"s8","sv":"bredbladig kalmia","latin":"Kalmia latifolia","cultivar":"'Elf'","cat":"Barr och städsegrönt","file":"s8.png","group":"Barr & städsegrönt"},{"id":"s9","sv":"myrtentry","latin":"Lonicera nitida","cultivar":"Elegant',  'Maigrün'","cat":"Barr och städsegrönt","file":"s9.png","group":"Barr & städsegrönt"},{"id":"s10","sv":"mahonia","latin":"Mahonia aquifolium","cultivar":"","cat":"Barr och städsegrönt","file":"s10.png","group":"Barr & städsegrönt"},{"id":"s11","sv":"japansk buskrosling","latin":"Pieris japonica","cultivar":"'Mountain Fire'","cat":"Barr och städsegrönt","file":"s11.png","group":"Barr & städsegrönt"},{"id":"s12","sv":"lagerhägg","latin":"Prunus laurocerasus","cultivar":"ETNA ('Anbri')","cat":"Barr och städsegrönt","file":"s12.png","group":"Barr & städsegrönt"},{"id":"s13","sv":"liten balsamgran","latin":"Abies balsamea","cultivar":"'Nana'","cat":"Barr och städsegrönt","file":"s13.png","group":"Barr & städsegrönt"},{"id":"s14","sv":"träd-en","latin":"Juniperus communis f. suecica","cultivar":"","cat":"Barr och städsegrönt","file":"s14.png","group":"Barr & städsegrönt"},{"id":"s15","sv":"gran","latin":"Picea abies","cultivar":"","cat":"Barr och städsegrönt","file":"s15.png","group":"Barr & städsegrönt"},{"id":"s16","sv":"tall","latin":"Pinus sylvestris","cultivar":"","cat":"Barr och städsegrönt","file":"s16.png","group":"Barr & städsegrönt"},{"id":"s17","sv":"hybrididegran","latin":"Taxus × media","cultivar":"'Hillii'","cat":"Barr och städsegrönt","file":"s17.png","group":"Barr & städsegrönt"},{"id":"s18","sv":"tuja","latin":"Thuja occidentalis","cultivar":"'Danica'","cat":"Barr och städsegrönt","file":"s18.png","group":"Barr & städsegrönt"},{"id":"s19","sv":"Rhododendron","latin":"Rhododendron Catawbiense","cultivar":"'Catawbiense Boursault'","cat":"Barr och städsegrönt","file":"s19.png","group":"Barr & städsegrönt"}];const colors=['#e89b39','#4a8c70','#7862a6','#db6680','#3d8ba7'];let deck=[],round=0,selected=-1,pairs=[],locked=false,score=0,groupItems=[];const $=s=>document.querySelector(s);function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){groupItems=items.filter(x=>x.group===$('#group').value);deck=[];const shuffled=shuffle([...groupItems]);for(let i=0;i<shuffled.length;i+=5)deck.push(shuffle(shuffled.slice(i,i+5)));round=0;score=0;$('#score').textContent='Rätt 0';$('#result').style.display='none';$('#game').style.display='block';render()}function render(){selected=-1;locked=false;pairs=Array(deck[round].length).fill(-1);$('#check').style.display='inline-block';$('#check').disabled=true;$('#next').style.display='none';$('#feedback').textContent='';$('#bar').style.width=(round/deck.length*100)+'%';$('#round').textContent='Rad '+(round+1)+' av '+deck.length;$('#category').textContent=$('#group').value;$('#status').textContent='0 av '+pairs.length+' ihopparade';const group=deck[round],names=shuffle(group.map((x,index)=>({x,index})));$('#names').innerHTML='';$('#images').innerHTML='';for(let n=0;n<names.length;n++){const entry=names[n],b=document.createElement('button');b.type='button';b.className='name-choice';b.style.setProperty('--dot',colors[entry.index%colors.length]);b.style.setProperty('--match',colors[entry.index%colors.length]);b.dataset.index=entry.index;b.innerHTML='<span class="dot"></span><span>'+entry.x.latin+'</span>';b.onclick=()=>selectName(entry.index);$('#names').append(b)}const imgs=shuffle(group.map((x,index)=>({x,index})));for(const entry of imgs){const c=document.createElement('button');c.type='button';c.className='plant-card';c.dataset.index=entry.index;c.innerHTML='<img src="'+entry.x.file+'" alt="Växtbild"><span class="img-caption">Bild '+(entry.index+1)+'</span><span class="revealed" hidden></span>';c.onclick=()=>selectImage(entry.index);$('#images').append(c)}}function selectName(i){if(locked)return;selected=i;document.querySelectorAll('.name-choice').forEach(b=>b.classList.toggle('selected',Number(b.dataset.index)===i))}function selectImage(i){if(locked)return;if(selected<0){$('#help').textContent='Välj först ett latinskt namn.';return}for(let k=0;k<pairs.length;k++)if(pairs[k]===selected)pairs[k]=-1;pairs[i]=selected;selected=-1;drawPairs();const n=pairs.filter(v=>v>=0).length;$('#status').textContent=n+' av '+pairs.length+' ihopparade';$('#check').disabled=n!==pairs.length;$('#help').textContent='Välj ett namn och sedan dess bild.'}function drawPairs(){document.querySelectorAll('.name-choice').forEach(b=>{const idx=Number(b.dataset.index),isUsed=pairs.includes(idx);b.classList.toggle('matched',isUsed);b.classList.remove('selected')});document.querySelectorAll('.plant-card').forEach(c=>{const idx=Number(c.dataset.index),name=pairs[idx];c.classList.toggle('matched',name>=0);if(name>=0)c.style.setProperty('--match',colors[name%colors.length]);c.querySelector('.img-caption').textContent=name>=0?'Par '+(name+1):'Bild '+(idx+1)})}function check(){locked=true;let correct=0;const group=deck[round];for(let i=0;i<pairs.length;i++){const ok=group[i].id===group[pairs[i]].id;if(ok)correct++;const card=document.querySelector('.plant-card[data-index="'+i+'"]');card.classList.add(ok?'correct':'incorrect');card.querySelector('.revealed').hidden=false;card.querySelector('.revealed').textContent=group[i].latin;const nb=document.querySelector('.name-choice[data-index="'+pairs[i]+'"]');nb.classList.add(ok?'correct':'incorrect')}score+=correct;$('#score').textContent='Rätt '+score;$('#feedback').textContent=correct===pairs.length?'Snyggt! Alla namn sitter.':correct+' av '+pairs.length+' rätt. Facit visas under bilderna.';$('#status').textContent=correct+' rätt av '+pairs.length;$('#check').style.display='none';$('#next').style.display='inline-block';$('#bar').style.width=((round+1)/deck.length*100)+'%'}function finish(){ $('#game').style.display='none';$('#bar').style.width='100%';$('#result').style.display='block';$('#result').innerHTML='<div class="eyebrow">Quiz klart</div><h2>'+score+' rätt</h2><p>Du matchade '+groupItems.length+' växter i kategorin '+$('#group').value+'.</p><button class="btn" id="play-again">Spela igen</button>';$('#play-again').onclick=start}$('#check').onclick=check;$('#next').onclick=()=>{round++;if(round>=deck.length)finish();else render()};$('#restart').onclick=start;$('#group').onchange=start;start();
</script></body></html>
